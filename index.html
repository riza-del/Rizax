<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riza · Portfolio</title>
    <style>
        /* ========================================
                   RESET & BASE
                ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #080b12;
            color: #e8edf5;
            background-image:
                radial-gradient(ellipse at 25% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.04) 0%, transparent 60%);
        }

        /* ========================================
                   CARD UTAMA
                ======================================== */
        .card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 24, 40, 0.55);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 56px;
            padding: 56px 48px 44px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.60),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            text-align: center;
            transition: all 0.4s ease;
        }

        /* ========================================
                   GLOW ORBS (Animasi)
                ======================================== */
        .card::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -25%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18), transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            animation: orbFloat1 14s ease-in-out infinite alternate;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -25%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.10), transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            animation: orbFloat2 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbFloat1 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-20px, 25px) scale(1.15);
            }
        }

        @keyframes orbFloat2 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(25px, -20px) scale(1.20);
            }
        }

        .content {
            position: relative;
            z-index: 2;
        }

        /* ========================================
                   BADGE ATAS
                ======================================== */
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.10);
            border: 1px solid rgba(99, 102, 241, 0.08);
            padding: 6px 18px 6px 14px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 500;
            color: #818cf8;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .top-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* ========================================
                   NAMA
                ======================================== */
        .name {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.05;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 45%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .sub-badge {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            -webkit-text-fill-color: #64748b;
        }

        /* ========================================
                   DIVIDER
                ======================================== */
        .divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.40), transparent);
            margin: 0 auto 32px;
            border-radius: 4px;
        }

        /* ========================================
                   INFO ITEMS
                ======================================== */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 36px;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 17px;
            color: #c8d0dc;
            transition: background 0.25s ease;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .info-item .icon {
            font-size: 20px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .info-item a {
            color: #c8d0dc;
            text-decoration: none;
            transition: color 0.25s ease;
            border-bottom: 1px solid transparent;
        }

        .info-item a:hover {
            color: #a5b4fc;
            border-bottom-color: rgba(99, 102, 241, 0.25);
        }

        /* ========================================
                   SOSIAL ICONS (Minimal)
                ======================================== */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 32px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #64748b;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.25s ease;
        }

        .social-icons a:hover {
            background: rgba(99, 102, 241, 0.10);
            border-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            transform: translateY(-2px);
        }

        /* ========================================
                   COPYRIGHT
                ======================================== */
        .footer {
            font-size: 13px;
            color: #475569;
            letter-spacing: 0.4px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .footer span {
            color: #64748b;
        }

        /* ========================================
                   RESPONSIVE
                ======================================== */
        @media (max-width: 600px) {
            .card {
                padding: 40px 24px 32px;
                border-radius: 40px;
            }

            .name {
                font-size: 40px;
            }

            .info-item {
                font-size: 15px;
                padding: 12px 12px;
                gap: 12px;
                flex-wrap: wrap;
            }

            .info-item .icon {
                font-size: 17px;
            }

            .top-badge {
                font-size: 10px;
                padding: 4px 14px 4px 10px;
            }

            .social-icons {
                gap: 14px;
            }

            .social-icons a {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 28px 16px 24px;
                border-radius: 32px;
            }

            .name {
                font-size: 32px;
            }

            .info-item {
                font-size: 13px;
                padding: 10px 8px;
                gap: 10px;
            }

            .info-item .icon {
                font-size: 15px;
            }

            .sub-badge {
                font-size: 11px;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="content">

            <!-- BADGE ATAS -->
            <div class="top-badge">
                <span class="dot"></span>
                Available
            </div>

            <!-- NAMA -->
            <div class="name">Riza</div>
            <span class="sub-badge">Based in Indonesia</span>

            <div class="divider"></div>

            <!-- INFO -->
            <div class="info-list">
                <div class="info-item">
                    <span class="icon">📍</span>
                    <span>Wonosobo, Jawa Tengah</span>
                </div>
                <div class="info-item">
                    <span class="icon">📧</span>
                    <a href="mailto:muhammadkhusnaghoiriza@gmail.com">
                        muhammadkhusnaghoiriza@gmail.com
                    </a>
                </div>
            </div>

            <!-- SOSIAL -->
            <div class="social-icons">
                <a href="#" aria-label="GitHub">🐙</a>
                <a href="#" aria-label="Twitter">🐦</a>
                <a href="#" aria-label="LinkedIn">🔗</a>
                <a href="#" aria-label="Instagram">📸</a>
            </div>

            <!-- COPYRIGHT -->
            <div class="footer">
                © <span id="year">2026</span> Riza. All rights reserved.
            </div>

        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
